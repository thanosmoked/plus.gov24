<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background: #f5f6fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #fff;
      border-radius: 14px;
      padding: 40px 32px 36px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.4px;
    }
    .login-header p {
      font-size: 13px;
      color: #888;
      margin-top: 6px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #3b5bdb;
    }
    .error-msg {
      background: #fff0f0;
      color: #e8003d;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid #ffd0d0;
    }
    .submit-btn {
      width: 100%;
      padding: 14px 0;
      background: #3b5bdb;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: -0.3px;
      transition: background 0.2s;
      margin-top: 4px;
    }
    .submit-btn:hover { background: #2f4ac4; }
    .submit-btn:active { background: #243a9a; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1>🔒 관리자 로그인</h1>
      <p>관리자만 접근할 수 있는 페이지입니다.</p>
    </div>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/admin/login">
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password"
               placeholder="관리자 비밀번호를 입력하세요" autofocus required>
      </div>
      <button type="submit" class="submit-btn">로그인</button>
    </form>
  </div>
</body>
</html>
